<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙階段抵達與等候打卡系統（大音量自動解鎖版）</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, ::before, ::after { box-sizing: border-box; border-width: 0; border-style: solid; border-color: #e2e8f0; }
        html { line-height: 1.5; -webkit-text-size-adjust: 100%; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { margin: 0; background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        h1, h2, h3, p { margin: 0; }
        button { cursor: pointer; background-color: transparent; }
        input { font-family: inherit; font-size: 100%; color: inherit; }
        
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .space-x-2 > * + * { margin-left: 0.5rem; }
        .space-x-3 > * + * { margin-left: 0.75rem; }
        .space-x-4 > * + * { margin-left: 1rem; }
        .space-y-3 > * + * { margin-top: 0.75rem; }
        .space-y-4 > * + * { margin-top: 1rem; }
        .space-y-6 > * + * { margin-top: 1.5rem; }
        .grid { display: grid; }
        .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
        .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        @media (min-width: 1024px) {
            .lg\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .lg\:col-span-1 { grid-column: span 1 / span 1; }
            .lg\:col-span-2 { grid-column: span 2 / span 2; }
        }
        .w-full { width: 100%; }
        .max-w-5xl { max-width: 64rem; margin-left: auto; margin-right: auto; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .py-8 { padding-top: 2rem; padding-bottom: 2rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .bg-white { background-color: #ffffff; }
        .bg-slate-50 { background-color: #f8fafc; }
        .bg-indigo-600 { background-color: #4f46e5; }
        .text-white { color: #ffffff; }
        .text-slate-800 { color: #1e293b; }
        .text-slate-900 { color: #0f172a; }
        .text-slate-500 { color: #64748b; }
        .text-slate-400 { color: #94a3b8; }
        .text-indigo-600 { color: #4f46e5; }
        .text-amber-500 { color: #f59e0b; }
        .text-amber-600 { color: #d97706; }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .text-xs { font-size: 0.75rem; }
        .text-sm { font-size: 0.875rem; }
        .text-base { font-size: 1rem; }
        .text-lg { font-size: 1.125rem; }
        .text-2xl { font-size: 1.5rem; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-full { border-radius: 9999px; }
        .border { border-width: 1px; }
        .border-slate-200 { border-color: #e2e8f0; }
        .shadow-sm { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        .shadow-md { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .sticky { position: sticky; }
        .top-0 { top: 0; }
        .z-10 { z-index: 10; }
        .hidden { display: none !important; }
        .flex-grow { flex-grow: 1; }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }
        
        @media print {
            body { background: white !important; }
            header, .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm no-print">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid fa-business-time text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">雙階段抵達與等候打卡系統</h1>
                    <p class="text-xs text-slate-500">大音量自動解鎖版 (台灣時區已修正)</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button id="open-config-btn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium px-3 py-2 rounded-xl transition flex items-center">
                    <i class="fa-solid fa-cloud-arrow-up mr-1.5 text-indigo-600"></i> 雲端設定
                </button>
                <div style="text-align: right;">
                    <div id="live-clock" class="text-lg font-bold text-indigo-600 font-mono">00:00:00</div>
                    <div id="live-date" class="text-xs text-slate-400">YYYY-MM-DD</div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 w-full flex-grow grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- 左側 -->
        <div class="lg:col-span-1 space-y-6 no-print">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wider mb-4 flex items-center">
                    <span style="display:inline-flex; width:24px; height:24px; align-items:center; justify-content:center; border-radius:9999px; background:#e0e7ff; color:#4f46e5; margin-right:0.5rem; font-size:12px; font-weight:bold;">1</span> 
                    步驟一：發送/記錄通知時間
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1" style="display:block; margin-bottom:0.25rem;">人員 / 訪客名稱</label>
                        <input type="text" id="person-name" placeholder="例如：mer-66" style="width:100%; background:#f8fafc; border:1px solid #cbd5e1; border-radius:0.75rem; padding:0.75rem; font-size:1rem;">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1" style="display:block; margin-bottom:0.25rem;">備註說明 / 代號 (選填)</label>
                        <input type="text" id="note-text" placeholder="例如：3103" style="width:100%; background:#f8fafc; border:1px solid #cbd5e1; border-radius:0.75rem; padding:0.75rem; font-size:1rem;">
                    </div>
                    <button id="notify-btn" style="width:100%; background:linear-gradient(to right, #4f46e5, #7c3aed); color:white; font-weight:bold; padding:0.875rem; border-radius:0.75rem; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1); display:flex; align-items:center; justify-content:center; gap:0.5rem;">
                        <i class="fa-solid fa-bell"></i>
                        <span>記錄通知時間 (加入待抵達)</span>
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wider mb-3 flex items-center justify-between">
                    <span class="flex items-center">
                        <i class="fa-solid fa-hourglass-half text-amber-500 mr-2"></i> 待抵達清單 (步驟二)
                    </span>
                    <span id="pending-count-badge" style="background:#fef3c7; color:#92400e; font-size:0.75rem; padding:0.125rem 0.625rem; border-radius:9999px; font-weight:bold;">0</span>
                </h2>
                <p class="text-xs text-slate-400 mb-4">點擊「人員已抵達」即刻鎖定抵達時間並移至右側。</p>
                <div id="pending-container" class="space-y-3" style="max-height:380px; overflow-y:auto;">
                    <div id="pending-empty" style="text-align:center; padding:1.5rem 0; color:#94a3b8; font-size:0.875rem;">目前沒有等待抵達的人員</div>
                </div>
            </div>
        </div>

        <!-- 右側 -->
        <div class="lg:col-span-2 space-y-6 w-full">
            <div class="grid grid-cols-3 gap-4 no-print">
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm" style="text-align:center;">
                    <span class="text-xs font-medium text-slate-400 block mb-1">完成打卡總數</span>
                    <span id="stat-total" class="text-2xl font-bold text-slate-800">0</span>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm" style="text-align:center;">
                    <span class="text-xs font-medium text-slate-400 block mb-1">平均等候時間</span>
                    <span id="stat-avg-time" class="text-2xl font-bold text-indigo-600">0 分鐘</span>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm" style="text-align:center;">
                    <span class="text-xs font-medium text-slate-400 block mb-1">最長等候時間</span>
                    <span id="stat-max-time" class="text-2xl font-bold text-amber-600">0 分鐘</span>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col" style="height:520px;">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-4 pb-3 border-b border-slate-100 gap-3" style="border-bottom:1px solid #f1f5f9; padding-bottom:0.75rem; margin-bottom:1rem;">
                    <div class="flex items-center space-x-2">
                        <h2 class="text-base font-bold text-slate-800 flex items-center">
                            <i class="fa-solid fa-chart-line text-indigo-500 mr-2"></i> 後台統計與已完成紀錄
                        </h2>
                        <span id="sync-status" style="font-size:10px; background:#f1f5f9; color:#64748b; padding:0.125rem 0.5rem; border-radius:9999px;">未同步雲端</span>
                    </div>
                    <div class="flex items-center space-x-2 no-print">
                        <button id="sync-cloud-btn" style="background:#4f46e5; color:white; font-size:0.75rem; font-weight:500; padding:0.5rem 0.75rem; border-radius:0.75rem; display:flex; align-items:center;">
                            <i class="fa-solid fa-cloud-arrow-down mr-1.5"></i> 重新載入
                        </button>
                        <button id="export-csv-btn" style="background:#059669; color:white; font-size:0.75rem; font-weight:500; padding:0.5rem 0.75rem; border-radius:0.75rem; display:flex; align-items:center;">
                            <i class="fa-solid fa-file-csv mr-1.5"></i> 匯出 CSV
                        </button>
                        <button id="print-pdf-btn" style="background:#1e293b; color:white; font-size:0.75rem; font-weight:500; padding:0.5rem 0.75rem; border-radius:0.75rem; display:flex; align-items:center;">
                            <i class="fa-solid fa-print mr-1.5"></i> 列印 / PDF
                        </button>
                        <button id="clear-history" style="font-size:0.75rem; color:#f43f5e; font-weight:500; padding:0.25rem 0.5rem;">
                            <i class="fa-solid fa-trash-can mr-1"></i> 清空畫面
                        </button>
                    </div>
                </div>

                <div id="records-container" class="overflow-y-auto flex-grow space-y-3">
                    <div id="empty-state" style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#94a3b8; padding:3rem 0;">
                        <i class="fa-solid fa-clipboard-list" style="font-size:2.5rem; margin-bottom:0.75rem; color:#cbd5e1;"></i>
                        <p class="text-base">尚無完成抵達的打卡紀錄</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 設定 Modal -->
    <div id="config-modal" class="hidden" style="position:fixed; inset:0; background:rgba(15,23,42,0.5); backdrop-filter:blur(4px); z-index:50; display:flex; align-items:center; justify-content:center;">
        <div style="background:white; border-radius:1rem; padding:1.5rem; max-width:28rem; width:100%; margin:0 1rem; box-shadow:0 25px 50px -12px rgba(0,0,0,0.25);">
            <h3 style="font-weight:700; font-size:1.125rem; color:#0f172a; margin-bottom:0.25rem; display:flex; align-items:center;">
                <i class="fa-solid fa-cloud text-indigo-600" style="color:#4f46e5; margin-right:0.5rem;"></i> Google 雲端連動設定
            </h3>
            <p style="font-size:0.75rem; color:#94a3b8; margin-bottom:1rem;">請輸入您的 Google Apps Script 網址 (Web App URL)。</p>
            <div style="margin-bottom:1.25rem;">
                <label style="display:block; font-size:0.75rem; font-weight:500; color:#64748b; margin-bottom:0.25rem;">Apps Script 網址</label>
                <input type="text" id="script-url-input" placeholder="https://script.google.com/macros/s/.../exec" style="width:100%; background:#f8fafc; border:1px solid #cbd5e1; border-radius:0.75rem; padding:0.75rem; font-size:0.75rem; font-family:monospace;">
            </div>
            <div style="display:flex; gap:0.5rem;">
                <button id="config-cancel-btn" style="flex:1; background:#f1f5f9; color:#334155; padding:0.625rem; border-radius:0.75rem; font-size:0.875rem; font-weight:500;">取消</button>
                <button id="config-save-btn" style="flex:1; background:#4f46e5; color:white; padding:0.625rem; border-radius:0.75rem; font-size:0.875rem; font-weight:500;">儲存並載入</button>
            </div>
        </div>
    </div>

    <!-- 訊息 Modal -->
    <div id="custom-modal" class="hidden" style="position:fixed; inset:0; background:rgba(15,23,42,0.5); backdrop-filter:blur(4px); z-index:50; display:flex; align-items:center; justify-content:center;">
        <div style="background:white; border-radius:1rem; padding:1.5rem; max-width:24rem; width:100%; margin:0 1rem; box-shadow:0 25px 50px -12px rgba(0,0,0,0.25);">
            <div style="display:flex; align-items:center; gap:0.75rem; margin-bottom:1rem;">
                <div id="modal-icon-container" style="width:2.5rem; height:2.5rem; border-radius:9999px; display:flex; align-items:center; justify-content:center; background:#e0e7ff; color:#4f46e5;">
                    <i id="modal-icon" class="fa-solid fa-info"></i>
                </div>
                <div><h3 id="modal-title" style="font-weight:700; color:#0f172a;">提示訊息</h3></div>
            </div>
            <p id="modal-message" style="font-size:0.875rem; color:#475569; margin-bottom:1.5rem; line-height:1.5;"></p>
            <div style="display:flex; justify-content:flex-end;">
                <button id="modal-close-btn" style="background:#4f46e5; color:white; padding:0.5rem 1.25rem; border-radius:0.75rem; font-size:0.875rem; font-weight:500;">確定</button>
            </div>
        </div>
    </div>

    <script>
        const liveClockEl = document.getElementById('live-clock');
        const liveDateEl = document.getElementById('live-date');
        const personNameInput = document.getElementById('person-name');
        const noteTextInput = document.getElementById('note-text');
        const notifyBtn = document.getElementById('notify-btn');
        const pendingContainer = document.getElementById('pending-container');
        const pendingCountBadge = document.getElementById('pending-count-badge');
        const recordsContainer = document.getElementById('records-container');
        const emptyState = document.getElementById('empty-state');
        const clearHistoryBtn = document.getElementById('clear-history');
        const statTotal = document.getElementById('stat-total');
        const statAvgTime = document.getElementById('stat-avg-time');
        const statMaxTime = document.getElementById('stat-max-time');
        const openConfigBtn = document.getElementById('open-config-btn');
        const syncCloudBtn = document.getElementById('sync-cloud-btn');
        const exportCsvBtn = document.getElementById('export-csv-btn');
        const printPdfBtn = document.getElementById('print-pdf-btn');
        const syncStatus = document.getElementById('sync-status');
        const configModal = document.getElementById('config-modal');
        const scriptUrlInput = document.getElementById('script-url-input');
        const configCancelBtn = document.getElementById('config-cancel-btn');
        const configSaveBtn = document.getElementById('config-save-btn');
        const customModal = document.getElementById('custom-modal');
        const modalMessage = document.getElementById('modal-message');
        const modalTitle = document.getElementById('modal-title');
        const modalCloseBtn = document.getElementById('modal-close-btn');
        const modalIconContainer = document.getElementById('modal-icon-container');
        const modalIcon = document.getElementById('modal-icon');

        let pendingList = []; 
        let completedRecords = []; 
        let scriptUrl = localStorage.getItem('gas_script_url') || '';
        let saveTimeouts = {};
        let audioCtx = null;

        document.addEventListener('click', () => {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {}
        }, { once: true });

        function playBeep(type = 'success') {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08); 
                    gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.35);
                } else {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime); 
                    gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                }
            } catch (e) {
                console.log('Audio error', e);
            }
        }

        function getTaiwanDate() {
            const now = new Date();
            // 強制校正為台灣時區 (+8)
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            return new Date(utc + (3600000 * 8));
        }

        function formatTimeDisplay(timeStr) {
    if (!timeStr) return '';
    const str = String(timeStr);
    
    // 如果雲端傳回來的是完整的 ISO 日期時間格式 (含 T)
    if (str.includes('T')) {
        const dateObj = new Date(str);
        const utc = dateObj.getTime() + (dateObj.getTimezoneOffset() * 60000);
        const taiwanDate = new Date(utc + (3600000 * 8));
        return `${String(taiwanDate.getHours()).padStart(2, '0')}:${String(taiwanDate.getMinutes()).padStart(2, '0')}:${String(taiwanDate.getSeconds()).padStart(2, '0')}`;
    }
    
    // 如果本來就是 "HH:mm:ss" 的字串，直接回傳
    return str.split('.')[0];


        function initApp() {
            updateClock();
            setInterval(updateClock, 1000);
            loadLocalData();
            configModal.classList.add('hidden');
            customModal.classList.add('hidden');
            if (scriptUrl) {
                syncStatus.textContent = '已連結雲端';
                syncStatus.style.background = '#d1fae5';
                syncStatus.style.color = '#047857';
                fetchFromCloud();
            }
        }

        function updateClock() {
            const now = getTaiwanDate();
            liveClockEl.textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            liveDateEl.textContent = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        function showModal(title, message, type = 'info') {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modalIconContainer.style.background = type === 'success' ? '#d1fae5' : type === 'warning' ? '#fef3c7' : '#e0e7ff';
            modalIconContainer.style.color = type === 'success' ? '#059669' : type === 'warning' ? '#d97706' : '#4f46e5';
            modalIcon.className = type === 'success' ? "fa-solid fa-check" : type === 'warning' ? "fa-solid fa-triangle-exclamation" : "fa-solid fa-info";
            customModal.classList.remove('hidden');
        }

        function hideModal() {
            customModal.classList.add('hidden');
        }

        modalCloseBtn.onclick = hideModal;
        customModal.onclick = (e) => { if (e.target === customModal) hideModal(); };

        openConfigBtn.onclick = () => {
            scriptUrlInput.value = scriptUrl;
            configModal.classList.remove('hidden');
        };

        function closeConfigModal() {
            configModal.classList.add('hidden');
        }

        configCancelBtn.onclick = closeConfigModal;
        configModal.onclick = (e) => { if (e.target === configModal) closeConfigModal(); };

        configSaveBtn.onclick = () => {
            scriptUrl = scriptUrlInput.value.trim();
            localStorage.setItem('gas_script_url', scriptUrl);
            closeConfigModal();
            if (scriptUrl) {
                syncStatus.textContent = '已連結雲端';
                syncStatus.style.background = '#d1fae5';
                syncStatus.style.color = '#047857';
                showModal('設定成功', '雲端網址已儲存，正在從雲端載入歷史資料...', 'success');
                fetchFromCloud();
            } else {
                syncStatus.textContent = '未同步雲端';
                syncStatus.style.background = '#f1f5f9';
                syncStatus.style.color = '#64748b';
            }
        };

        notifyBtn.onclick = () => {
            const personName = personNameInput.value.trim();
            if (!personName) {
                showModal('欄位未填寫', '請先輸入人員或訪客名稱！', 'warning');
                return;
            }

            playBeep('notify'); 

            const now = getTaiwanDate();
            const newItem = {
                id: Date.now(),
                name: personName,
                notifyTime: `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`,
                notifyTimestamp: now.getTime(),
                note: noteTextInput.value.trim() || '',
                _status: 'PENDING'
            };

            pendingList.push(newItem);
            saveLocalData();
            renderPendingList();
            upsertSingleItemToCloud(newItem);

            personNameInput.value = '';
            noteTextInput.value = '';
        };

        window.confirmArrival = function(id) {
            const index = pendingList.findIndex(item => item.id === id);
            if (index === -1) return;

            playBeep('success'); 

            const item = pendingList[index];
            const now = getTaiwanDate();
            const arrivalTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            const diffMinutesRounded = Math.round(((now.getTime() - item.notifyTimestamp) / 1000 / 60) * 10) / 10;

            const completedItem = {
                id: item.id,
                name: item.name,
                cardNumber: '', 
                notifyTime: item.notifyTime,
                arrivalTime: arrivalTimeStr,
                waitingMinutes: diffMinutesRounded,
                note: item.note,
                completedAt: now.toLocaleString(),
                _status: 'COMPLETED'
            };

            pendingList.splice(index, 1);
            completedRecords.unshift(completedItem);

            saveLocalData();
            renderPendingList();
            renderCompletedRecords();
            upsertSingleItemToCloud(completedItem);
        };

        window.updateCardNumber = function(id, newCardVal) {
            const rec = completedRecords.find(r => r.id === id);
            if (rec) {
                rec.cardNumber = newCardVal.trim();
                rec._status = 'COMPLETED';
                saveLocalData();
                clearTimeout(saveTimeouts[id]);
                saveTimeouts[id] = setTimeout(() => { upsertSingleItemToCloud(rec); }, 800);
            }
        };

        window.removePending = function(id) {
            pendingList = pendingList.filter(item => item.id !== id);
            saveLocalData();
            renderPendingList();
        };

        window.deleteRecord = function(id) {
            completedRecords = completedRecords.filter(r => r.id !== id);
            saveLocalData();
            renderCompletedRecords();
        };

        clearHistoryBtn.onclick = () => {
            if (completedRecords.length === 0) return;
            if (confirm('確定要清空畫面上的已完成紀錄嗎？\n(雲端試算表的歷史紀錄將會完整保留)')) {
                completedRecords = [];
                saveLocalData();
                renderCompletedRecords();
                showModal('已清空畫面', '前端畫面已清空，雲端歷史資料已安全保留。', 'info');
            }
        };

        async function upsertSingleItemToCloud(item) {
            if (!scriptUrl) return;
            syncStatus.textContent = '同步中...';
            try {
                await fetch(scriptUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'upsert', data: item })
                });
                syncStatus.textContent = '已同步雲端';
                syncStatus.style.background = '#d1fae5';
                syncStatus.style.color = '#047857';
            } catch (err) {
                syncStatus.textContent = '同步失敗';
            }
        }

        async function fetchFromCloud() {
            if (!scriptUrl) return;
            try {
                const response = await fetch(scriptUrl, { method: 'GET', redirect: 'follow' });
                const data = await response.json();
                if (data) {
                    if (Array.isArray(data.completed)) {
                        const localMap = new Map(completedRecords.map(r => [r.id, r]));
                        data.completed.forEach(cloudRec => {
                            if (!localMap.has(cloudRec.id)) completedRecords.push(cloudRec);
                        });
                        completedRecords.sort((a, b) => b.id - a.id);
                    }
                    if (Array.isArray(data.pending)) pendingList = data.pending;
                    saveLocalData();
                    renderPendingList();
                    renderCompletedRecords();
                }
            } catch (err) { console.error(err); }
        }

        syncCloudBtn.onclick = () => {
            if (!scriptUrl) { openConfigBtn.onclick(); return; }
            fetchFromCloud();
            showModal('重新載入', '已從雲端 Google 試算表同步最新紀錄。', 'success');
        };

        exportCsvBtn.onclick = () => {
            if (completedRecords.length === 0) {
                showModal('無法匯出', '目前沒有任何已完成的打卡紀錄。', 'warning');
                return;
            }
            let csvContent = '\uFEFF項次,人員名稱,接藥人卡號,通知時間,抵達時間,等候時間(分鐘),備註說明,完成時間\n';
            completedRecords.forEach((rec, index) => {
                csvContent += `${index + 1},"${rec.name}","${rec.cardNumber || ''}",${formatTimeDisplay(rec.notifyTime)},${formatTimeDisplay(rec.arrivalTime)},${rec.waitingMinutes},"${rec.note || ''}","${rec.completedAt}"\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `打卡統計_${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
        };

        printPdfBtn.onclick = () => { window.print(); };

        function saveLocalData() {
            localStorage.setItem('two_step_pending', JSON.stringify(pendingList));
            localStorage.setItem('two_step_completed', JSON.stringify(completedRecords));
        }

        function loadLocalData() {
            try {
                const lp = localStorage.getItem('two_step_pending');
                const lc = localStorage.getItem('two_step_completed');
                if (lp) pendingList = JSON.parse(lp);
                if (lc) completedRecords = JSON.parse(lc);
            } catch (e) { console.error(e); }
            renderPendingList();
            renderCompletedRecords();
        }

        function renderPendingList() {
            pendingContainer.innerHTML = '';
            pendingCountBadge.textContent = pendingList.length;
            if (pendingList.length === 0) {
                pendingContainer.innerHTML = `<div style="text-align:center; padding:1.5rem 0; color:#94a3b8; font-size:0.875rem;">目前沒有等待抵達的人員</div>`;
                return;
            }
            pendingList.forEach(item => {
                const card = document.createElement('div');
                card.style.cssText = "background:rgba(254,243,199,0.65); border:1px solid #fde68a; border-radius:0.75rem; padding:1rem; display:flex; flex-direction:column; gap:0.75rem;";
                card.innerHTML = `
                    <div style="display:flex; align-items:center; justify-content:space-between;">
                        <span style="font-weight:700; color:#0f172a; font-size:1rem;">${escapeHtml(item.name)}</span>
                        <span style="font-size:0.75rem; background:#fef3c7; color:#92400e; padding:0.25rem 0.625rem; border-radius:9999px; font-family:monospace; font-weight:bold;"><i class="fa-solid fa-bell mr-1"></i>${formatTimeDisplay(item.notifyTime)}</span>
                    </div>
                    ${item.note ? `<div style="font-size:0.75rem; color:#475569; font-style:italic;">備註：${escapeHtml(item.note)}</div>` : ''}
                    <div style="display:flex; align-items:center; gap:0.5rem; padding-top:0.25rem;">
                        <button onclick="confirmArrival(${item.id})" style="flex-grow:1; background:#059669; color:white; font-size:0.875rem; font-weight:bold; padding:0.625rem 0.75rem; border-radius:0.75rem; display:flex; align-items:center; justify-content:center; gap:0.375rem;">
                            <i class="fa-solid fa-check-circle"></i><span>人員已抵達 (打卡計時)</span>
                        </button>
                        <button onclick="removePending(${item.id})" style="color:#94a3b8; padding:0.5rem;"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                `;
                pendingContainer.appendChild(card);
            });
        }

        function renderCompletedRecords() {
            recordsContainer.innerHTML = '';
            if (completedRecords.length === 0) {
                emptyState.style.display = 'flex';
                recordsContainer.appendChild(emptyState);
                statTotal.textContent = '0';
                statAvgTime.textContent = '0 分鐘';
                statMaxTime.textContent = '0 分鐘';
                return;
            }
            emptyState.style.display = 'none';

            let totalMinutes = 0;
            let maxMinutes = 0;

            completedRecords.forEach((rec, index) => {
                const waitMin = Number(rec.waitingMinutes) || 0;
                totalMinutes += waitMin;
                if (waitMin > maxMinutes) maxMinutes = waitMin;

                const card = document.createElement('div');
                card.style.cssText = "background:#f8fafc; border:1px solid #e2e8f0; border-radius:0.75rem; padding:1rem; display:flex; flex-direction:column; gap:0.5rem;";
                card.innerHTML = `
                    <div style="display:flex; align-items:center; justify-content:space-between;">
                        <div style="display:flex; align-items:center; gap:0.5rem;">
                            <span style="font-size:0.75rem; font-weight:bold; background:#e0e7ff; color:#4f46e5; padding:0.125rem 0.375rem; border-radius:0.375rem;">#${completedRecords.length - index}</span>
                            <span style="font-weight:700; color:#0f172a; font-size:0.9375rem;">${escapeHtml(rec.name)}</span>
                            ${rec.note ? `<span style="font-size:0.75rem; background:#f1f5f9; color:#64748b; padding:0.125rem 0.375rem; border-radius:0.375rem;">備註: ${escapeHtml(rec.note)}</span>` : ''}
                        </div>
                        <div style="display:flex; align-items:center; gap:0.75rem;">
                            <span style="font-size:0.875rem; font-weight:bold; color:#4f46e5;"><i class="fa-regular fa-clock mr-1"></i>${waitMin} 分鐘</span>
                            <button onclick="deleteRecord(${rec.id})" class="no-print" style="color:#94a3b8; font-size:0.75rem;"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                    <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; font-size:0.75rem; color:#64748b; padding-top:0.25rem; border-top:1px dashed #e2e8f0; gap:0.5rem;">
                        <div style="display:flex; gap:1rem;">
                            <span>通知：<strong style="color:#334155; font-family:monospace;">${formatTimeDisplay(rec.notifyTime)}</strong></span>
                            <span>抵達：<strong style="color:#059669; font-family:monospace;">${formatTimeDisplay(rec.arrivalTime)}</strong></span>
                        </div>
                        <div class="no-print" style="display:flex; align-items:center; gap:0.375rem;">
                            <span style="font-size:10px;">卡號：</span>
                            <input type="text" value="${escapeHtml(rec.cardNumber || '')}" placeholder="輸入卡號" oninput="updateCardNumber(${rec.id}, this.value)" style="background:white; border:1px solid #cbd5e1; border-radius:0.375rem; padding:0.125rem 0.375rem; font-size:0.75rem; width:80px;">
                        </div>
                        <div class="print-only">
                            <span>卡號：${escapeHtml(rec.cardNumber || '無')}</span>
                        </div>
                    </div>
                `;
                recordsContainer.appendChild(card);
            });

            statTotal.textContent = completedRecords.length;
            statAvgTime.textContent = `${Math.round((totalMinutes / completedRecords.length) * 10) / 10} 分鐘`;
            statMaxTime.textContent = `${maxMinutes} 分鐘`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        window.onload = initApp;
    </script>
</body>
</html>
