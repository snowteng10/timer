<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人員抵達與等候打卡系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center p-4 sm:p-8">

    <!-- 頂部標題 -->
    <header class="max-w-xl w-full mb-6 flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <h1 class="text-lg font-bold text-indigo-600 flex items-center gap-2">
            ⏱️ <span>人員抵達打卡系統</span>
        </h1>
        <div id="live-clock" class="text-sm bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full font-mono font-medium"></div>
    </header>

    <!-- 主操作區 -->
    <main class="max-w-xl w-full flex flex-col gap-6">

        <!-- 步驟一：發送/記錄通知時間 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex items-center gap-2 mb-4">
                <span class="bg-indigo-100 text-indigo-700 w-7 h-7 rounded-full flex items-center justify-center font-bold text-sm">1</span>
                <h2 class="font-bold text-lg text-slate-700">發送 / 記錄通知時間</h2>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">人員 / 訪客名稱</label>
                    <input type="text" id="person-name" placeholder="例如：張先生 / 外送員A" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">備註說明 (選填)</label>
                    <input type="text" id="person-note" placeholder="例如：會議室A / 文件簽收" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>

            <button onclick="recordNotification()" class="mt-6 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition shadow-sm flex items-center justify-center gap-2">
                🔔 記錄通知時間 (開始計時)
            </button>
        </div>

        <!-- 步驟二：待抵達清單 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                    <span class="bg-amber-100 text-amber-700 w-7 h-7 rounded-full flex items-center justify-center font-bold text-sm">2</span>
                    <h2 class="font-bold text-lg text-slate-700">待抵達清單</h2>
                </div>
                <span id="pending-count-badge" class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-full">0</span>
            </div>
            
            <p class="text-xs text-slate-400 mb-3">人員抵達後，請點擊下方清單進行第二階段打卡。</p>

            <div id="pending-list" class="space-y-2 max-h-96 overflow-y-auto pr-1">
                <div class="text-center text-slate-400 py-10 text-sm">目前沒有等待抵達的人員</div>
            </div>
        </div>

        <!-- 已完成清單區塊 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                    <span class="bg-emerald-100 text-emerald-700 w-7 h-7 rounded-full flex items-center justify-center font-bold text-sm">✓</span>
                    <h2 class="font-bold text-lg text-slate-700">已完成打卡紀錄</h2>
                </div>
                <button onclick="clearHistory()" class="text-xs text-slate-400 hover:text-red-500 transition">清除紀錄</button>
            </div>

            <div id="history-list" class="space-y-2 max-h-80 overflow-y-auto pr-1">
                <div class="text-center text-slate-400 py-6 text-sm">尚無打卡完成紀錄</div>
            </div>
        </div>

    </main>

    <!-- 第二階段抵達打卡彈窗 (修改名字與空白備註) -->
    <div id="arrive-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl">
            <h3 class="font-bold text-lg text-slate-800 mb-4">✨ 確認人員抵達資訊</h3>
            <div class="space-y-3 mb-5">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">抵達人員姓名</label>
                    <input type="text" id="modal-arrive-name" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">備註欄 (空白格可填寫)</label>
                    <input type="text" id="modal-arrive-note" placeholder="請在此輸入備註文字..." class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="closeArriveModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 rounded-xl transition text-sm">取消</button>
                <button onclick="confirmArrival()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition text-sm">確認打卡</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        let pendingList = JSON.parse(localStorage.getItem('pending_list')) || [];
        let historyList = JSON.parse(localStorage.getItem('history_list')) || [];
        let currentTargetId = null;

        updateClock();
        setInterval(updateClock, 1000);
        renderAll();

        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString('zh-TW');
        }

        function recordNotification() {
            const name = document.getElementById('person-name').value.trim();
            const note = document.getElementById('person-note').value.trim();
            
            if (!name) {
                alert('請輸入人員或訪客名稱！');
                return;
            }

            const newItem = {
                id: 'ID_' + Date.now(),
                name: name,
                note: note,
                notifyTime: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                timestamp: Date.now()
            };

            pendingList.push(newItem);
            saveAndRender();

            document.getElementById('person-name').value = '';
            document.getElementById('person-note').value = '';
        }

        function openArriveModal(id) {
            currentTargetId = id;
            const item = pendingList.find(p => p.id === id);
            if (item) {
                document.getElementById('modal-arrive-name').value = item.name;
                document.getElementById('modal-arrive-note').value = item.note || '';
                document.getElementById('arrive-modal').classList.remove('hidden');
            }
        }

        function closeArriveModal() {
            document.getElementById('arrive-modal').classList.add('hidden');
            currentTargetId = null;
        }

        function confirmArrival() {
            const arriveName = document.getElementById('modal-arrive-name').value.trim();
            const arriveNote = document.getElementById('modal-arrive-note').value.trim();

            const index = pendingList.findIndex(p => p.id === currentTargetId);
            if (index !== -1) {
                const item = pendingList.splice(index, 1)[0];
                const arriveTimeDate = new Date();
                const arriveTimeString = arriveTimeDate.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                
                const waitMinutes = Math.max(0, Math.round((arriveTimeDate.getTime() - item.timestamp) / 60000));

                const completedItem = {
                    id: item.id,
                    arriveName: arriveName || item.name,
                    notifyTime: item.notifyTime,
                    arriveTime: arriveTimeString,
                    waitMinutes: waitMinutes,
                    note: arriveNote
                };

                historyList.unshift(completedItem);
                saveAndRender();
            }

            closeArriveModal();
        }

        function clearHistory() {
            if (confirm('確定要清除所有已完成的打卡紀錄嗎？')) {
                historyList = [];
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('pending_list', JSON.stringify(pendingList));
            localStorage.setItem('history_list', JSON.stringify(historyList));
            renderAll();
        }

        function renderAll() {
            // 渲染待抵達清單
            const pendingContainer = document.getElementById('pending-list');
            document.getElementById('pending-count-badge').innerText = pendingList.length;

            if (pendingList.length === 0) {
                pendingContainer.innerHTML = `<div class="text-center text-slate-400 py-10 text-sm">目前沒有等待抵達的人員</div>`;
            } else {
                pendingContainer.innerHTML = pendingList.map(item => `
                    <div class="bg-slate-50 border border-slate-100 p-3.5 rounded-xl flex items-center justify-between gap-3">
                        <div>
                            <div class="font-bold text-sm text-slate-700">${item.name}</div>
                            <div class="text-xs text-slate-400 mt-0.5">通知時間：${item.notifyTime} ${item.note ? ' | 備註：' + item.note : ''}</div>
                        </div>
                        <button onclick="openArriveModal('${item.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium px-3.5 py-2 rounded-lg transition shrink-0">
                            人員已抵達
                        </button>
                    </div>
                `).join('');
            }

            // 渲染已完成紀錄
            const historyContainer = document.getElementById('history-list');
            if (historyList.length === 0) {
                historyContainer.innerHTML = `<div class="text-center text-slate-400 py-6 text-sm">尚無打卡完成紀錄</div>`;
            } else {
                historyContainer.innerHTML = historyList.map(item => `
                    <div class="bg-slate-50 border border-slate-100 p-3 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                        <div>
                            <div class="font-bold text-sm text-slate-700">${item.arriveName} <span class="text-xs font-normal text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full ml-1">等候 ${item.waitMinutes} 分鐘</span></div>
                            <div class="text-xs text-slate-400 mt-0.5">通知：${item.notifyTime} ➜ 抵達：${item.arriveTime} ${item.note ? ' | 備註：' + item.note : ''}</div>
                        </div>
                    </div>
                `).join('');
            }
        }
    </script>
</body>
</html>
