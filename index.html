<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>檢查後拔針倒數計時器</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; text-align: center; padding: 40px 20px; color: #333; }
        .card { background: white; max-width: 400px; margin: 0 auto; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #0284c7; margin-bottom: 10px; }
        p { color: #666; font-size: 15px; margin-bottom: 20px; }
        #timer { font-size: 48px; font-weight: bold; color: #0f172a; margin: 20px 0; background: #f8fafc; padding: 15px; border-radius: 12px; border: 2px solid #e2e8f0; }
        .alert { color: #dc2626; font-weight: bold; font-size: 20px; display: none; margin-top: 20px; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="card">
        <h2>拔針時間倒數</h2>
        <p>請靜候休息，時間歸零後請至櫃台依序拔針</p>
        <div id="timer">15:00</div>
        <div id="alertMsg" class="alert">時間到！請至櫃台找護理師拔針</div>
    </div>
    <script>
        let timeLeft = 15 * 60; // 15分鐘（900秒）
        const timerDisplay = document.getElementById('timer');
        const alertMsg = document.getElementById('alertMsg');
        
        const countdown = setInterval(() => {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerDisplay.textContent = "00:00";
                alertMsg.style.display = "block";
            }
            timeLeft--;
        }, 1000);
    </script>
</body>
</html>
